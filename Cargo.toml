[package]
name = "rustybench"
version = "0.6.0"
description = "A small benchmark runner for Rust."
license = "MIT"
repository = "https://github.com/laputa-systems/rustybench"
edition = "2024"
rust-version = "1.100"
exclude = [
    ".github/**",
    ".gitignore",
    "tools/bump_minor_release.sh",
]

[dependencies]
rustybench-macros = { version = "=0.6.0", path = "macros" }
regex-lite = "0.1"
lexopt = "0.3"
deser = { version = "0.10.2", default-features = false, features = ["derive"] }
deser-json = { version = "0.10.2", default-features = false }
rustc-hash = "2"

[[bin]]
name = "rustybench"
path = "src/bin/rustybench.rs"

[[bench]]
name = "bench"
path = "benches/bench.rs"
harness = false

[[test]]
name = "collector"
path = "tests/collector.rs"
harness = false

[workspace]
members = ["macros"]
