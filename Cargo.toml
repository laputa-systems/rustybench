[package]
name = "rustybench"
version = "0.2.0"
description = "A small benchmark runner for Rust."
license = "MIT"
repository = "https://github.com/joshuarli/rustybench"
edition = "2024"
rust-version = "1.100"
exclude = [
    ".github/**",
    ".gitignore",
    "tools/bump_minor_release.sh",
]

[features]
default = []
# Experimental timing backend. This is intentionally excluded from the
# default build; the default timing contract remains the
# std::time::Instant/SeqCst path documented in RESOLUTION.md.
quanta-timer = ["dep:quanta"]

[dependencies]
rustybench-macros = { version = "=0.2.0", path = "macros" }
regex-lite = "0.1"
lexopt = "0.3"
miniserde = "0.1"
quanta = { version = "0.12.6", optional = true }

[[bin]]
name = "rustybench"
path = "src/bin/rustybench.rs"

[[bench]]
name = "bench"
path = "benches/bench.rs"
harness = false

[workspace]
members = ["macros"]
