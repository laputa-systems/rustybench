[package]
name = "rustybench-macros"
version = "0.4.0"
description = "Procedural macros for the rustybench benchmark runner."
license = "MIT"
repository = "https://github.com/laputa-systems/rustybench"
edition = "2024"

[lib]
proc-macro = true

[dependencies]
syn = { version = "3", default-features = false, features = [
    "full",
    "parsing",
    "proc-macro",
] }
