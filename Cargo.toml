[package]
name = "rustybench"
version = "0.1.0"
description = "A small benchmark runner for Rust."
license = "MIT"
repository = "https://github.com/joshuarli/rustybench"
edition = "2024"
rust-version = "1.97"
exclude = [
    ".github/**",
    ".gitignore",
]

[dependencies]
rustybench-macros = { version = "=0.1.0", path = "macros" }
regex-lite = "0.1"
lexopt = "0.3"
miniserde = "0.1"

[[bin]]
name = "rustybench"
path = "src/bin/rustybench.rs"

[[bench]]
name = "bench"
path = "benches/bench.rs"
harness = false

[workspace]
members = ["macros"]
